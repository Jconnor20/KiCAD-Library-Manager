# cargo-deny policy: advisories, licenses compatible with GPL-3.0-or-later, duplicate versions, registry sources.
[graph]
# The app ships on Windows only; skip platform-specific crates for other targets.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.8
# egui's bundled fonts: the Ubuntu Font Licence covers the font data embedded in the binary, not code.
exceptions = [{ allow = ["Ubuntu-font-1.0"], crate = "epaint_default_fonts" }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
