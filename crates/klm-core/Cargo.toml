[package]
name = "klm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = "1.0.104"
calamine = { version = "0.38.0", default-features = false }
dirs = "7.0.0"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "form", "query"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
tempfile = "3"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
